<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPMB</title>
  <link rel="icon" href="https://mentariilmu.org/logo.png" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden;
      /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh;
      /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="iframe-container">
    <iframe id="app" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQp11DOlY8bdK3LI2T2G4k4cyItFqyL6HrcBHetFcD8LatZR41GWgBwUHuHHi7hxN5pydx_MtSwnT9-/pubhtml?widget=true&amp;headers=false" scrolling="yes" allowfullscreen="true"
      webkitallowfullscreen="true" mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
</body>

</html>
